<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
  
    
    function loadPlayerPrefab() {
        
        switchTab('inspector');
        switchExplorerTab('contentExplorer');
        loadProject('Contact E');
  
        const sceneView = document.getElementById('scene-view');
        sceneView.innerHTML = ""; 
  
       
        const canvas = document.createElement('canvas');
        canvas.id = 'playerCanvas';
        canvas.style.width = '100%';
        canvas.style.height = '10%';
        sceneView.appendChild(canvas);
        
  
        
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(sceneView.clientWidth, sceneView.clientHeight);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x3c3c3c); 
  
        const camera = new THREE.PerspectiveCamera(70, sceneView.clientWidth / sceneView.clientHeight, 1, 2000);
        camera.position.set(0, 250, 500);
        
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(1000, 1000, 5000);
        scene.add(directionalLight);
  
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 50, 0);
        controls.update();
        
        let loadedObject = null;
        
        const loader = new FBXLoader();
        const textureLoader = new THREE.TextureLoader();
        const fbxTexture = textureLoader.load('MeTexture.png');

        loader.load('Person.fbx', function (object) {
            
            object.scale.set(1.1, 1, 1.1);
            
           
            object.traverse(child => {
                if (child.isMesh) {
                    child.material.map = fbxTexture;
                    child.material.needsUpdate = true;
                }
            });
    
            scene.add(object);
            loadedObject = object;
        }, undefined, function (error) {
            console.error('Error loading FBX:', error);
    });

  
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            if (loadedObject) {
       if (!InputEvent.onMouseMove) {
        loadedObject.rotation.y += 0.01;
       }

        if (Input.GetKey(KeyCode.A)) rb.AddForce(-orientation.right * horizontalThrustForce * Time.deltaTime);
        // forward
        if (Input.GetKey(KeyCode.W)) rb.AddForce(orientation.forward * horizontalThrustForce * Time.deltaTime);
        // shorten cable
        if (Input.GetKey(KeyCode.Space))
        {
            Vector3 directionToPoint = swingPoint - transform.position;
            rb.AddForce(directionToPoint.normalized * forwardThrustForce * Time.deltaTime);
            float distanceFromPoint = Vector3.Distance(transform.position, swingPoint);
            joint.maxDistance = distanceFromPoint * 0.8f;
            joint.minDistance = distanceFromPoint * 0.25f;
        }
        // extend cable
        if (Input.GetKey(KeyCode.S))
        {
            float extendedDistanceFromPoint = Vector3.Distance(transform.position, swingPoint) + extendCableSpeed;
            joint.maxDistance = extendedDistanceFromPoint * 0.8f;
            joint.minDistance = extendedDistanceFromPoint * 0.25f;
        }
    }

	float EvaluatePathCost(NavMeshPath path)
	{
		float cost = 0f;
		Vector3[] corners = path.corners;

		for (int i = 0; i < corners.Length - 1; i++)
		{
			Vector3 A = corners[i];
			Vector3 B = corners[i + 1];
			float dist = Vector3.Distance(A, B);
			cost += dist;

			// vertical penalty
			float dh = B.y - A.y;
			if (dh > jumpHeightThreshold)      cost += jumpPenalty;
			else if (-dh > fallHeightThreshold) cost += fallPenalty;

			// turn penalty
			if (i > 0)
			{
				Vector3 prevDir = (A - corners[i - 1]).normalized;
				Vector3 currDir = (B - A).normalized;
				float angle = Vector3.Angle(prevDir, currDir);
				cost += angle * turnAngleWeight;
			}
		}

		return cost;

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function applyInspectorCodeStyling() {
            const view = document.getElementById('inspector-view');
            if (!view) return;

            // don't touch when inspector already contains structured HTML (like Blueprintinspector)
            if (view.querySelector('.inspector-code')) return;

            // if the view only contains a single text node, treat it as code and wrap it
            const onlyTextNode = view.childNodes.length === 1 && view.childNodes[0].nodeType === Node.TEXT_NODE;
            if (onlyTextNode && view.innerText.trim() !== '') {
                const txt = view.innerText;
                view.innerHTML = `<pre class="inspector-code">${escapeHtml(txt)}</pre>`;
            }
        }

        // observe changes to the inspector view and apply the wrapper automatically
        const inspectorView = document.getElementById('inspector-view');
        if (inspectorView) {
            const observer = new MutationObserver(() => applyInspectorCodeStyling());
            observer.observe(inspectorView, { childList: true, characterData: true, subtree: true });

            // call once to catch any existing plain text
        }
       
        document.querySelectorAll('.draggable').forEach(el => {
            el.onmousedown = function (event) {
                let panel = el.parentElement;
                let shiftX = event.clientX - panel.getBoundingClientRect().left;
                let shiftY = event.clientY - panel.getBoundingClientRect().top + 50;
                let gridSize = 5;

                panel.style.position = 'absolute';
                panel.style.zIndex = 1000;

                function moveAt(pageX, pageY) {
                    let newX = Math.round((pageX - shiftX) / gridSize) * gridSize;
                    let newY = Math.round((pageY - shiftY) / gridSize) * gridSize;
                    panel.style.left = `${newX}px`;
                    panel.style.top = `${newY}px`;
                }

                function onMouseMove(event) {
                    moveAt(event.pageX, event.pageY);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.onmouseup = function () {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.onmouseup = null;
                };
            };

                let startX = event.clientX;
                let startY = event.clientY;
                let startWidth = panel.offsetWidth;
                let startHeight = panel.offsetHeight;

                function onMouseMove(event) {
                    let newWidth = startWidth + (event.clientX - startX);
                    let newHeight = startHeight + (event.clientY - startY);
                    
                    panel.style.width = `${Math.max(newWidth, 200)}px`;
